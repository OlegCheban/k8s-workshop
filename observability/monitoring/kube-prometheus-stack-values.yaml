# Workshop defaults for kube-prometheus-stack 87.18.1.
# The chart version is pinned in scripts/monitoring-deploy.sh.

defaultRules:
  create: true

# Docker Desktop does not publish these control-plane metrics endpoints on the
# node address. Keeping their monitors enabled would create permanently failing
# scrape targets and misleading workshop alerts.
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 10d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableAdminAPI: false
    walCompression: true

    # Monitoring objects are kept in the monitoring namespace. A ServiceMonitor
    # or PodMonitor may still select targets from another namespace explicitly.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

alertmanager:
  enabled: true
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  enabled: true
  adminPassword: ""
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Docker Desktop does not expose / as a shared/slave mount. Keep the host root
# mounted for node metrics, but do not request Linux mount propagation.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: None
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
