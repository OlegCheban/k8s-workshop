apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true
        timeout: 10s
        compaction:
          directory: /var/lib/otelcol
          on_start: true

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      transform/elasticsearch_bodymap:
        error_mode: ignore
        log_statements:
          - context: scope
            statements:
              - set(attributes["elastic.mapping.mode"], "bodymap")
      batch:
        send_batch_size: 1024
        timeout: 1s

    exporters:
      elasticsearch:
        endpoints:
          - http://elasticsearch.observability.svc.cluster.local:9200
        logs_index: otel-logs
        mapping:
          allowed_modes:
            - bodymap
            - otel
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage
        retry:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_retries: 10
      otlp_grpc/jaeger:
        endpoint: host.docker.internal:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0

    service:
      extensions:
        - health_check
        - file_storage
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - transform/elasticsearch_bodymap
            - batch
          exporters:
            - elasticsearch
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp_grpc/jaeger
