apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: otel-collector-agent
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-container-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: checkpoints
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-agent-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: docker-container-logs
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/otelcol-agent
            type: DirectoryOrCreate
