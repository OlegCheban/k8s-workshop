apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: agent
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true
        timeout: 10s
        compaction:
          directory: /var/lib/otelcol
          on_start: true

    receivers:
      file_log/application:
        include:
          - /var/log/pods/k8s-workshop_*/*/*.log
        exclude:
          - /var/log/pods/observability_otel-collector-*/*/*.log
        start_at: end
        include_file_path: true
        storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0
        operators:
          - id: container-parser
            type: container
          - id: application-json-parser
            type: json_parser
            parse_from: body
            parse_to: body

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.node.name
            - k8s.deployment.name
      transform/application:
        error_mode: ignore
        log_statements:
          - set(log.body["k8sNamespace"], resource.attributes["k8s.namespace.name"])
          - set(log.body["k8sPodName"], resource.attributes["k8s.pod.name"])
          - set(log.body["k8sPodUid"], resource.attributes["k8s.pod.uid"])
          - set(log.body["k8sContainerName"], resource.attributes["k8s.container.name"])
          - set(log.body["k8sNodeName"], resource.attributes["k8s.node.name"])
          - set(log.body["k8sDeploymentName"], resource.attributes["k8s.deployment.name"])
      batch:
        send_batch_size: 512
        timeout: 1s

    exporters:
      otlp_grpc/gateway:
        endpoint: otel-collector-gateway.observability.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0

    service:
      extensions:
        - health_check
        - file_storage
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        logs/application:
          receivers:
            - file_log/application
          processors:
            - memory_limiter
            - k8s_attributes
            - transform/application
            - batch
          exporters:
            - otlp_grpc/gateway
